<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nonchopper | Official Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #05070e;
      --bg-card: rgba(14, 20, 38, 0.72);
      --accent-cyan: #5ce1e6;
      --accent-violet: #9d7bff;
      --text-main: #eef2ff;
      --text-muted: #b0bdd1;
      --border-glow: rgba(92, 225, 230, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Noto Sans JP', sans-serif;
      line-height: 1.85;
      overflow-x: hidden;
    }
    header {
      position: fixed;
      top: 0; width: 100%;
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 7, 14, 0.78);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 100;
    }
    .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 0.14em;
      color: var(--text-main);
      text-decoration: none;
      white-space: nowrap;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      transition: color 0.3s;
      white-space: nowrap;
    }
    nav a:hover { color: var(--accent-cyan); }
    @media (max-width: 640px) {
      header { padding: 0.9rem 3.5%; }
      .logo { font-size: 0.98rem; letter-spacing: 0.1em; }
      nav { gap: 0.65rem; }
      nav a { font-size: 0.66rem; letter-spacing: 0.03em; }
    }
    /* トップ画面（ファーストビュー） */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 1.5rem 4rem;
      background-image:
        linear-gradient(to bottom, rgba(5, 7, 14, 0.35) 0%, rgba(5, 7, 14, 0.55) 65%, #05070e 100%),
        url('yokogao.png');
      background-size: cover;
      background-position: center 25%;
      background-repeat: no-repeat;
    }
    .hero-sub {
      font-size: 0.82rem;
      letter-spacing: 0.35em;
      color: var(--accent-cyan);
      margin-bottom: 1rem;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }
    .hero h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      letter-spacing: 0.2em;
      font-weight: 400;
      margin-bottom: 1.2rem;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9), 0 0 30px rgba(92, 225, 230, 0.35);
    }
    .hero p {
      max-width: 600px;
      color: #f1f5f9;
      font-size: 0.95rem;
      font-weight: 300;
      margin-bottom: 2.2rem;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
    }
    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary, .btn-outline {
      padding: 0.75rem 1.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-decoration: none;
      transition: all 0.3s;
      backdrop-filter: blur(6px);
    }
    .btn-primary {
      background: rgba(92, 225, 230, 0.25);
      border: 1px solid var(--accent-cyan);
      color: var(--text-main);
      box-shadow: 0 0 20px rgba(92, 225, 230, 0.25);
    }
    .btn-primary:hover {
      background: var(--accent-cyan);
      color: #05070e;
      font-weight: 500;
    }
    .btn-outline {
      background: rgba(5, 7, 14, 0.5);
      border: 1px solid rgba(255,255,255,0.4);
      color: var(--text-main);
    }
    .btn-outline:hover {
      border-color: var(--text-main);
      background: rgba(255,255,255,0.15);
    }
    section {
      max-width: 1080px;
      margin: 0 auto;
      padding: 5.5rem 1.5rem;
    }
    h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      letter-spacing: 0.2em;
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 400;
    }
    h2 span {
      display: block;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.75rem;
      color: var(--accent-cyan);
      letter-spacing: 0.25em;
      margin-top: 0.4rem;
    }
    /* CONCEPT & PROFILE スタイル */
    .concept-box {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 2.8rem 2.2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      margin-top: 2rem;
    }
    .concept-lead {
      text-align: center;
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--text-main);
      margin-bottom: 1.6rem;
      line-height: 1.9;
    }
    .concept-lead em {
      font-style: normal;
      color: var(--accent-cyan);
    }
    .concept-body {
      max-width: 740px;
      margin: 0 auto 2.5rem;
      color: var(--text-muted);
      font-size: 0.94rem;
      font-weight: 300;
      text-align: left;
    }
    .concept-body p + p {
      margin-top: 1.1rem;
    }
    .profile-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(92, 225, 230, 0.35), transparent);
      margin: 2.2rem 0;
    }
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
      text-align: left;
    }
    .profile-block h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      color: var(--accent-cyan);
      margin-bottom: 0.7rem;
      font-weight: 600;
    }
    .profile-name {
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      margin-bottom: 0.5rem;
    }
    .profile-text {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 300;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }
    .tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      background: rgba(92, 225, 230, 0.08);
      border: 1px solid rgba(92, 225, 230, 0.25);
      color: var(--text-main);
      letter-spacing: 0.05em;
    }
    /* 統合シリーズコンテナ */
    .series-container {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 2.4rem 2rem;
      margin-top: 2.5rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .series-header {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 1.4rem;
    }
    .series-label {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      color: var(--accent-cyan);
    }
    .series-title {
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-main);
    }
    .series-concept {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 300;
    }
    .chapter-block + .chapter-block {
      margin-top: 2.4rem;
      padding-top: 2rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
    }
    .chapter-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--accent-cyan);
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }
    .series-sequence {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
    }
    @media (max-width: 768px) {
      .series-sequence {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.9rem;
      }
      .series-container {
        padding: 1.8rem 1.2rem;
      }
    }
    .seq-item {
      background: rgba(5, 7, 14, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s, border-color 0.3s;
    }
    .seq-item:hover {
      transform: translateY(-4px);
      border-color: var(--accent-cyan);
    }
    .seq-thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #090d16;
    }
    .seq-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .seq-item:hover .seq-thumb img {
      transform: scale(1.05);
    }
    .seq-caption {
      padding: 0.75rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .seq-caption.with-sub {
      align-items: flex-start;
    }
    .seq-num {
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      color: var(--accent-cyan);
      letter-spacing: 0.1em;
      flex-shrink: 0;
      line-height: 1.4;
    }
    .seq-text-group {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .seq-name {
      font-size: 0.86rem;
      color: var(--text-main);
      letter-spacing: 0.04em;
      line-height: 1.35;
    }
    .seq-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 300;
      line-height: 1.4;
    }
    /* EXHIBITION（展示履歴・スケジュール）スタイル */
    .exhibition-box {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 2.4rem 2rem;
      margin-top: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .ex-group-title {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      color: var(--accent-cyan);
      margin-bottom: 1.2rem;
      font-weight: 600;
    }
    .ex-group-title.past {
      margin-top: 2.2rem;
      padding-top: 1.8rem;
      border-top: 1px dashed rgba(255, 255, 255, 0.12);
    }
    .ex-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }
    .ex-item {
      display: grid;
      grid-template-columns: 165px 1fr;
      gap: 0.5rem 1.2rem;
      padding: 1rem 1.2rem;
      background: rgba(5, 7, 14, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      align-items: baseline;
    }
    .ex-item.featured {
      border-color: rgba(92, 225, 230, 0.45);
      background: rgba(92, 225, 230, 0.06);
    }
    .ex-date {
      font-size: 0.8rem;
      color: var(--accent-cyan);
      letter-spacing: 0.04em;
      font-weight: 400;
    }
    .ex-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
    }
    .ex-work {
      font-size: 0.82rem;
      color: #c7d2fe;
      font-weight: 400;
      margin-top: 0.25rem;
    }
    .ex-badge {
      display: inline-block;
      font-size: 0.72rem;
      padding: 0.08rem 0.55rem;
      margin-right: 0.45rem;
      border-radius: 999px;
      background: rgba(92, 225, 230, 0.12);
      border: 1px solid rgba(92, 225, 230, 0.35);
      color: var(--accent-cyan);
      vertical-align: baseline;
    }
    .ex-venue {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 300;
      margin-top: 0.2rem;
    }
    @media (max-width: 640px) {
      .exhibition-box { padding: 1.8rem 1.2rem; }
      .ex-item { grid-template-columns: 1fr; padding: 0.9rem 1rem; }
    }
    /* LINKS スタイル */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-top: 2rem;
    }
    .link-card {
      display: block;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1.4rem;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.3s;
    }
    .link-card:hover {
      border-color: var(--accent-cyan);
      background: rgba(92, 225, 230, 0.08);
    }
